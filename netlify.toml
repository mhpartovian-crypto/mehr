[[redirects]]
from = "/en/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/ar/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/ru/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-XSS-Protection = "1; mode=block"
  X-Content-Type-Options = "nosniff"
