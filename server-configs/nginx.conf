# Nginx Configuration for Persis Metal Multi-Language SPA
# Handles root redirect and SPA fallback for /en/, /ar/, /ru/ subdirectories

server {
    listen 80;
    server_name persismetal.com www.persismetal.com;
    
    # Root directory containing all three language builds
    root /var/www/persismetal;
    index index.html;
    
    # ============================================
    # ROOT DOMAIN REDIRECT (HTTP 301)
    # Redirects all root domain visits to /en/
    # ============================================
    location = / {
        return 301 https://www.persismetal.com/en/;
    }
    
    # Also redirect any request that doesn't match /en/, /ar/, or /ru/
    location ~ ^/(?!en|ar|ru)(.*)$ {
        return 301 https://www.persismetal.com/en/$1;
    }
    
    # ============================================
    # ENGLISH SITE (/en/)
    # ============================================
    location /en/ {
        try_files $uri $uri/ /en/index.html;
        
        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ============================================
    # ARABIC SITE (/ar/)
    # ============================================
    location /ar/ {
        try_files $uri $uri/ /ar/index.html;
        
        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ============================================
    # RUSSIAN SITE (/ru/)
    # ============================================
    location /ru/ {
        try_files $uri $uri/ /ru/index.html;
        
        # Add security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # ============================================
    # HTTPS REDIRECTION (Optional - if SSL is handled here)
    # ============================================
    # Uncomment below if you want HTTP to HTTPS redirect on this server
    # listen 443 ssl http2;
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
}

